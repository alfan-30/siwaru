<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Admin - Dashboard</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style type="text/tailwindcss">
    body {
      font-family: 'Poppins', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
    }
  </style>
</head>

<body class="bg-gray-100 h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#343A3F] flex flex-col shadow-lg p-6 transform -translate-x-full transition-transform duration-300 z-50 md:translate-x-0">
    <div class="flex flex-col items-center mb-8">
      <img alt="SIWARU Logo" class="w-full h-20 object-contain" src="assets/SIWARU.png" />
    </div>
    <nav class="flex-1 space-y-3">
      <a class="flex items-center px-4 py-2 bg-gray-700 text-white font-semibold rounded-lg" href="#">
        <span class="material-symbols-outlined mr-3">home</span>
        Dashboard
      </a>
	  
      <a class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg" href="editjadwalADMIN.html">
        <span class="material-symbols-outlined mr-3">calendar_month</span>
        Jadwal
      </a>

      <!-- Bio Data -->
      <div>
        <button id="bioToggle" aria-expanded="false"
          class="flex items-center justify-between w-full px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg">
          <span class="flex items-center">
            <span class="material-symbols-outlined mr-3">badge</span>
            Bio Data
          </span>
          <span id="bioChevron" class="material-symbols-outlined transition-transform duration-200">expand_more</span>
        </button>
        <div id="submenuBio" class="ml-10 mt-1 space-y-1 hidden" aria-hidden="true">
          <a href="dataguruADMIN.html" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-600 rounded-md">Data Guru</a>
          <a href="datasiswaADMIN.html" class="block px-4 py-2 text-gray-400 hover:text-white hover:bg-gray-600 rounded-md">Data Siswa</a>
        </div>
      </div>
	  
	  <!-- Riwayat -->
      <a class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg" href="riwayatADMIN.html">
        <span class="material-symbols-outlined mr-3">history</span>
        Riwayat
      </a>
    </nav>
	
    <!-- Logout di paling bawah -->
    <div class="px-2 mb-4">
      <a href="login.html"
        class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg">
        <span class="material-symbols-outlined mr-3">logout</span>
        Logout
      </a>
    </div>
  </aside>

  <!-- Overlay untuk mobile -->
  <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 md:hidden"></div>

  <!-- Main Content -->
  <div class="flex flex-col min-h-screen md:pl-64">
    <!-- Header -->
    <header class="flex justify-between items-center p-4 bg-white border-b">
      <div class="flex items-center">
        <!-- Burger hanya muncul di mobile -->
        <button id="burgerBtn" class="mr-4 text-gray-700 md:hidden">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 class="text-xl font-semibold">Admin</h1>
      </div>
      <div class="flex items-center space-x-4">
        <a href="profileADMIN.html" 
          class="p-2 rounded-full hover:bg-gray-200 transition flex items-center justify-center">
          <span class="material-symbols-outlined text-gray-500">person</span>
        </a>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6 bg-gray-100 overflow-y-auto">
      <h2 class="text-2xl font-bold mb-6">Dashboard</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
		<!-- Data Jadwal -->
		<div
		  class="bg-blue-500 text-black p-6 rounded-lg shadow-md hover:shadow-xl hover:scale-105 hover:-translate-y-1 transition-transform duration-300">
		  <div class="flex items-center justify-between mb-4">
			<p class="font-semibold">Data Jadwal</p>
			<span class="material-symbols-outlined text-4xl text-blue-700 opacity-50">calendar_month</span>
		  </div>
		  <a href="editjadwalADMIN.html"
			class="block text-center mt-2 px-4 py-2 rounded-md bg-blue-700 text-white hover:bg-blue-800 transition">
			Lihat Detail
		  </a>
		</div>

	<!-- Riwayat -->
	<div
	  class="bg-yellow-400 text-black p-6 rounded-lg shadow-md hover:shadow-xl hover:scale-105 hover:-translate-y-1 transition-transform duration-300">
	  <div class="flex items-center justify-between mb-4">
		<p class="font-semibold">Riwayat</p>
		<span class="material-symbols-outlined text-4xl text-yellow-700 opacity-50">bookmarks</span>
	  </div>
	  <a href="riwayatADMIN.html"
		class="block text-center mt-2 px-4 py-2 rounded-md bg-yellow-600 text-white hover:bg-yellow-700 transition">
		Lihat Detail
	  </a>
	</div>

	<!-- Data Guru -->
	<div
	  class="bg-red-500 text-black p-6 rounded-lg shadow-md hover:shadow-xl hover:scale-105 hover:-translate-y-1 transition-transform duration-300">
	  <div class="flex items-center justify-between mb-4">
		<p class="font-semibold">Data Guru</p>
		<span class="material-symbols-outlined text-4xl text-red-700 opacity-50">groups</span>
	  </div>
	  <a href="dataguruADMIN.html"
		class="block text-center mt-2 px-4 py-2 rounded-md bg-red-700 text-white hover:bg-red-800 transition">
		Lihat Detail
	  </a>
	</div>

	<!-- Data Siswa -->
	<div
	  class="bg-cyan-500 text-black p-6 rounded-lg shadow-md hover:shadow-xl hover:scale-105 hover:-translate-y-1 transition-transform duration-300">
	  <div class="flex items-center justify-between mb-4">
		<p class="font-semibold">Data Siswa</p>
		<span class="material-symbols-outlined text-4xl text-cyan-700 opacity-50">groups</span>
	  </div>
	  <a href="datasiswaADMIN.html"
		class="block text-center mt-2 px-4 py-2 rounded-md bg-cyan-700 text-white hover:bg-cyan-800 transition">
		Lihat Detail
	  </a>
	</div>
		</main>

    <!-- Footer -->
    <footer class="p-4 bg-white text-center border-t">
      <p class="text-sm text-gray-500">Copyright@SIWARU2025</p>
    </footer>
  </div>

  <!-- Script -->
<script src="js/DashboardADMIN.js"></script>
  <div id="react-bridge" hidden></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
