<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Profil Saya</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style type="text/tailwindcss">
    body { font-family: 'Poppins', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
    @media print {
      aside, header, footer, #overlay, .no-print, [data-act] { display: none !important; }
      .md\:pl-64 { padding-left: 0 !important; }
      body { background: #fff !important; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
</head>
<body class="bg-gray-100 min-h-screen" data-page="profile-guru" data-role="guru">
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#343A3F] flex flex-col shadow-lg p-6 transform -translate-x-full transition-transform duration-300 z-50 md:translate-x-0">
    <div class="flex flex-col items-center mb-4">
      <img alt="SIWARU Logo" class="w-full h-20 object-contain" src="assets/SIWARU.png" />
    </div>
    <div class="text-center mb-6">
      <p data-fill="nama" class="text-white font-bold text-lg leading-tight">&nbsp;</p>
      <p data-fill="role" class="text-gray-300 text-sm">Guru Mapel</p>
    </div>
    <nav class="flex-1 space-y-2 overflow-y-auto">
      <a href="DashboardGURU.html" class="flex items-center px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-600/40 hover:text-white">
        <span class="material-symbols-outlined mr-3">home</span>Dashboard
      </a>
      <a href="jadwalGURU.html" class="flex items-center px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-600/40 hover:text-white">
        <span class="material-symbols-outlined mr-3">calendar_month</span>Jadwal
      </a>
      <a href="absensiGURU.html" class="flex items-center px-4 py-2.5 rounded-lg text-gray-300 hover:bg-slate-600/40 hover:text-white">
        <span class="material-symbols-outlined mr-3">checklist</span>Absensi
      </a>
    </nav>
    <div class="border-t border-gray-600 pt-4 mt-4">
      <a id="btnLogout" href="login.html" class="flex items-center px-6 py-2.5 text-gray-300 hover:text-white rounded-lg">
        <span class="material-symbols-outlined mr-4">logout</span>Logout
      </a>
    </div>
  </aside>
  <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-40 md:hidden"></div>

  <div class="flex flex-col min-h-screen md:pl-64">
    <header class="flex justify-between items-center px-6 py-5 bg-white border-b">
      <div class="flex items-center">
        <button id="burgerBtn" type="button" class="mr-4 text-gray-700 md:hidden"><span class="material-symbols-outlined">menu</span></button>
        <h1 class="text-xl font-semibold">Sistem Absensi Siswa Dan Guru</h1>
      </div>
      <a href="profileGURU.html" class="p-2 rounded-full hover:bg-gray-100 flex items-center justify-center"><span class="material-symbols-outlined text-gray-800">person</span></a>
    </header>

    <main class="flex-1 p-6 bg-gray-100">
        <h2 class="text-2xl font-bold mb-6">Profil</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
          <!-- Profile Card -->
          <div class="bg-white shadow-md rounded-lg p-6">
            <div class="flex flex-col items-center">
			  <!-- Wrapper foto + tombol -->
			  <div class="relative">
				<!-- Foto profil -->
				<img id="profileImage" src="assets/cakwe_sore.png" alt="Profile" 
					 class="w-24 h-24 rounded-full object-cover transition-transform duration-300 ease-in-out hover:scale-110">

				<!-- Tombol icon kamera di pojok kanan bawah foto -->
				<label for="uploadProfile" 
					   class="absolute bottom-0 right-0 bg-gray-700 text-white w-8 h-8 flex items-center justify-center rounded-full cursor-pointer hover:bg-gray-900 shadow-lg">
				  <span class="material-symbols-outlined text-sm">photo_camera</span>
				</label>
			  </div>

			  <!-- Input file disembunyikan -->
			  <input type="file" id="uploadProfile" accept="image/*" class="hidden" />

			  <h3 class="text-lg font-semibold mt-4">viko</h3>
			  <p class="text-gray-500">Guru</p>
			</div>
          </div>

          <!-- Edit Profile Form -->
		<div class="bg-white shadow-md rounded-lg p-6">
		  <h3 class="text-lg font-semibold mb-4">Edit Profile</h3>
		  <form id="editProfileForm" class="space-y-4">
			<!-- Nip/Nis -->
			<div>
			  <label for="nip_nis" class="block text-sm font-medium">Nip/Nis</label>
			  <input type="text" id="nip_nis" placeholder="Masukkan nip/nis"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				maxlength="20" value="20251004" />

			  <!-- Pesan error -->
			  <small id="nipError" class="text-red-500 text-sm hidden">NIP/NIS wajib angka!</small>
			</div>

			<!-- Nama -->
			<div>
			  <label for="nama" class="block text-sm font-medium">Nama</label>
			  <input type="text" id="nama" placeholder="Masukkan nama Anda"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				value="Vikobiasalah" />

			  <!-- Pesan error -->
			  <small id="namaError" class="text-red-500 text-sm hidden">Nama hanya boleh huruf!</small>
			</div>

			<!-- Role -->
			<div>
			  <label class="block text-sm font-medium mb-1">Role</label>
			  <select class="w-full border rounded-md p-2">
				<option>Super User</option>
				<option selected>User</option>
			  </select>
			</div>

			<!-- Jabatan -->
			<div>
			  <label class="block text-sm font-medium mb-1">Jabatan</label>
			  <select class="w-full border rounded-md p-2">
				<option>Administrator</option>
				<option selected>Guru Mapel</option>
				<option>Siswa</option>
			  </select>
			</div>

			<!-- No. Tlp -->
			<div>
			  <label for="no_tlp" class="block text-sm font-medium">No. Tlp</label>
			  <input type="text" id="no_tlp" placeholder="Masukkan no.tlp Anda"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				maxlength="12" value="081234567890" />

			  <!-- Pesan error -->
			  <small id="tlpError" class="text-red-500 text-sm hidden">No. Tlp wajib angka dan maksimal 12 digit!</small>
			</div>

			<!-- Email -->
			<div>
			  <label for="email" class="block text-sm font-medium">Email</label>
			  <input type="email" id="email" placeholder="Masukkan email Anda"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				value="viko_bassmalah@student.umaha" />
			
			  <!-- Pesan error -->
			  <small id="emailError" class="text-red-500 text-sm hidden">Email Tidak Sesuai!</small>
			</div>

			<!-- Alamat -->
			<div>
			  <label class="block text-sm font-medium mb-1">Alamat</label>
			  <textarea rows="3" placeholder="Masukkan alamat lengkap Anda"
				class="w-full border rounded-md p-2 resize-none">Jl. nanom No. 32, Wringinanom</textarea>
			</div>

			<!-- Jenis Kelamin -->
			<div>
			  <label class="block text-sm font-medium mb-1">Jenis Kelamin</label>
			  <select class="w-full border rounded-md p-2">
				<option value="">Pilih jenis kelamin</option>
				<option value="Laki-laki" selected>Laki-laki</option>
				<option value="Perempuan">Perempuan</option>
			  </select>
			</div>

			<!-- Tombol -->
			<button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">
			  Simpan
			</button>
		  </form>
		 </div>
        </div>
      </main>
    <footer class="p-4 bg-white text-center border-t">
      <p class="text-sm text-gray-500">Copyright &copy; SIWARU 2025</p>
    </footer>
  </div>
  <script src="js/profileGURU.js"></script>
  <script type="module" src="/src/panel.js"></script>
</body>
</html>
