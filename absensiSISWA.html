<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>SIWARU - Sistem Absensi Siswa dan Guru</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style type="text/tailwindcss">
    body { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
</head>
<body class="bg-white min-h-screen flex flex-col">
  <header class="bg-slate-800 py-5 relative">
    <div class="flex justify-center"><img src="assets/SIWARU.png" alt="SIWARU" class="h-16 object-contain" /></div>
    <nav class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-1 text-gray-200">
      <a href="jadwalSISWA.html" title="Jadwal" class="p-2 rounded-full hover:bg-slate-700"><span class="material-symbols-outlined">calendar_month</span></a>
      <a href="profileSiswa.html" title="Profil" class="p-2 rounded-full hover:bg-slate-700"><span class="material-symbols-outlined">person</span></a>
      <a id="btnLogout" href="login.html" title="Logout" class="p-2 rounded-full hover:bg-slate-700"><span class="material-symbols-outlined">logout</span></a>
    </nav>
  </header>

  <main class="flex-1 w-full max-w-6xl mx-auto px-4 pb-16">
    <h1 class="text-xl font-bold text-center text-slate-800 py-4">Sistem Absensi Siswa dan Guru</h1>

    <section class="bg-white shadow-md border-l-4 border-yellow-400 px-6 py-5 flex items-start justify-between gap-4">
      <div class="space-y-0.5">
        <p><b>Nomer Induk Siswa</b> : <span id="infoNis">-</span></p>
        <p><b>Nama</b> : <span id="infoNama">-</span></p>
        <p><b>Kelas</b> : <span id="infoKelas">-</span></p>
        <p><b>Keterangan</b> : <span id="infoKet" class="text-gray-500">Memuat...</span></p>
      </div>
      <img src="assets/logo-sekolah.png" alt="Logo sekolah" class="h-24 object-contain hidden sm:block" />
    </section>

    <section class="relative mt-4 bg-[#ebebeb] rounded-lg shadow-md overflow-hidden min-h-[300px] flex items-center justify-center">
      <img src="assets/ilustrasi-clipboard.png" alt="" class="hidden md:block absolute left-0 bottom-0 h-[300px] mix-blend-multiply" />
      <img src="assets/ilustrasi-notebook.png" alt="" class="hidden md:block absolute right-0 top-0 h-[300px] mix-blend-multiply" />
      <div class="relative text-center px-4 py-10">
        <p class="text-gray-800">Tanggal &amp; Jam:</p>
        <p id="clock" class="text-2xl sm:text-3xl font-bold text-slate-900 my-3">--</p>
        <button id="btnAbsen" type="button" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg">
          <span class="material-symbols-outlined">back_hand</span>Absensi
        </button>
      </div>
    </section>
  </main>

  <footer class="bg-slate-800 text-white text-center py-4 fixed bottom-0 inset-x-0">Copyright@SIWARU2025</footer>

  <!-- Form absensi: dibuka saat tombol Absensi ditekan (hanya 07:00 - 07:30 WIB) -->
  <div id="absensiModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
      <h3 class="text-lg font-semibold mb-4">Form Absensi</h3>
      <form id="absensiForm" class="space-y-4" novalidate>
        <div><label class="block text-sm font-medium">Nama</label><input id="namaSiswa" type="text" readonly class="mt-1 w-full border rounded-lg px-3 py-2 bg-gray-100" /></div>
        <div><label class="block text-sm font-medium">Nomor Induk Siswa</label><input id="nisSiswa" type="text" readonly class="mt-1 w-full border rounded-lg px-3 py-2 bg-gray-100" /></div>
        <div><label class="block text-sm font-medium">Mata Pelajaran</label><input id="mapel" type="text" class="mt-1 w-full border rounded-lg px-3 py-2" required /></div>
        <div><label class="block text-sm font-medium">Tanggal</label><input id="tanggal" type="date" readonly class="mt-1 w-full border rounded-lg px-3 py-2 bg-gray-100 pointer-events-none" /></div>
        <div><label class="block text-sm font-medium">Status</label>
          <select id="status" class="mt-1 w-full border rounded-lg px-3 py-2" required>
            <option value="">Pilih Status</option><option value="Masuk">Masuk</option><option value="Izin">Izin</option><option value="Alpa">Alpa</option>
          </select></div>
        <p id="absensiInfo" class="text-sm font-medium"></p>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" id="btnBatal" class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-100">Batal</button>
          <button type="submit" id="btnSimpan" class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/absensi-config.js"></script>
  <script type="module" src="/src/siswa-absensi.js"></script>
</body>
</html>
