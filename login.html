<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login SIWARU</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
    /* Bayangan untuk Kotak Luar (Lebih lebar, menyebar lembut) */
    .outer-box-shadow {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.05);
    }
    /* Bayangan untuk Kotak Dalam (Tegas dan timbul di atas kotak luar persis gambar) */
    .inner-box-shadow {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    /* Sembunyikan ikon mata bawaan browser Edge / IE */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none !important;
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
</head>

<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden">
  
  <!-- Sisi Kiri (50%): Latar Abu-abu dengan Logo SIWARU -->
  <div class="w-full md:w-1/2 bg-[#e5e7eb] flex items-center justify-center p-8 min-h-[40vh] md:min-h-screen">
    <img 
      src="assets/SIWARU.png" 
      alt="SIWARU Logo" 
      class="w-72 sm:w-80 md:w-[430px] max-w-full h-auto object-contain"
    />
  </div>

  <!-- Sisi Kanan (50%): Latar Putih Keabuan dengan Kotak Ganda -->
  <div class="w-full md:w-1/2 bg-[#f4f5f7] flex items-center justify-center p-6 md:p-12 min-h-[60vh] md:min-h-screen">
    
    <!-- 1. TAMPILAN PEMBUKA: Kotak Luar + Kotak Dalam Persis Gambar -->
    <div id="roleSelection" class="bg-white rounded-[20px] outer-box-shadow p-7 sm:p-9 w-full max-w-[460px] flex items-center justify-center">
      
      <!-- Kotak Dalam yang Timbul -->
      <div class="bg-white rounded-[14px] inner-box-shadow w-full px-7 py-8 sm:px-9 sm:py-9">
        <h1 class="text-[22px] sm:text-[25px] font-bold text-center text-[#111827] mb-7 tracking-normal">
          SELAMAT DATANG
        </h1>

        <div class="space-y-4">
          <button
            type="button"
            id="btnPilihSiswa"
            class="w-full bg-[#1868ff] hover:bg-blue-700 text-white py-3 px-4 rounded-[8px] font-semibold text-[14px] transition duration-200"
          >
            Login Siswa
          </button>
          <button
            type="button"
            id="btnPilihGuru"
            class="w-full bg-[#16a34a] hover:bg-green-700 text-white py-3 px-4 rounded-[8px] font-semibold text-[14px] transition duration-200"
          >
            Login Guru
          </button>
        </div>
      </div>

    </div>

    <!-- 2. TAMPILAN FORM LOGIN: Muncul Saat Klik Login Siswa / Login Guru -->
    <div id="loginFormContainer" class="hidden bg-white rounded-[16px] outer-box-shadow w-full max-w-[380px] p-8 sm:p-9">
      <h1 class="text-[22px] sm:text-[24px] font-bold text-center text-[#111827] mb-7">
        SELAMAT DATANG
      </h1>

      <form id="loginForm" class="space-y-4">
        <!-- Input NIS / NIP -->
        <div>
          <label id="identifierLabel" for="identifierInput" class="block text-xs text-gray-500 mb-1.5 font-normal">
            Nis/Nomer Induk Siswa
          </label>
          <input
            id="identifierInput"
            type="text"
            placeholder="Masukkan NIS Anda"
            class="w-full px-3.5 py-2.5 bg-white border border-gray-300 rounded-[8px] text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
          />
        </div>

        <!-- Input Password -->
        <div>
          <label for="password" class="block text-xs text-gray-500 mb-1.5 font-normal">
            Password
          </label>
          <div class="relative">
            <input
              id="password"
              type="password"
              placeholder="Masukkan password Anda"
              class="w-full px-3.5 py-2.5 pr-10 bg-white border border-gray-300 rounded-[8px] text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />
            <button
              type="button"
              id="togglePassword"
              class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700 transition"
            >
              <span class="material-icons text-lg">visibility_off</span>
            </button>
          </div>
          
          <div class="flex justify-end mt-1.5">
            <a href="#" id="forgotPassword" class="text-[11px] text-gray-400 hover:text-blue-600 transition">
              Lupa Password?
            </a>
          </div>
        </div>

        <!-- Tombol Login & Kembali -->
        <div class="space-y-2.5 pt-2">
          <button
            type="submit"
            id="btnLoginSubmit"
            class="w-full bg-[#1868ff] hover:bg-blue-700 text-white py-2.5 px-4 rounded-[8px] font-semibold text-sm transition duration-200"
          >
            Login
          </button>
          <button
            type="button"
            id="btnKembali"
            class="w-full bg-[#cbd5e1] hover:bg-gray-400 text-gray-700 py-2.5 px-4 rounded-[8px] font-medium text-sm transition duration-200"
          >
            ← Kembali
          </button>
        </div>
      </form>

      <!-- Link Registrasi (Hanya Muncul di Dalam Form Login Siswa/Guru) -->
      <p class="text-xs text-center mt-6 text-gray-500">
        Tidak punya akun? <a href="registrasi.html" class="text-[#1868ff] hover:underline font-semibold">Registrasi</a>
      </p>
    </div>

  </div>

  <!-- Script -->
  <script src="js/login.js"></script>
  <div id="react-bridge" hidden></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
