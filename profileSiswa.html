<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Siswa - Profile</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style type="text/tailwindcss">
    body { font-family: 'Poppins', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen antialiased">
  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-[#343A3F] transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-40 flex flex-col justify-between">
    
    <!-- Bagian atas sidebar -->
    <div>
      <div class="flex flex-col items-center mb-8 mt-6 px-6">
        <img alt="SIWARU Logo" class="w-full h-20 object-contain" src="assets/SIWARU.png" />
      </div>

      <nav class="space-y-3 px-6">
        <a class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg"
          href="DashboardSISWA.html">
          <span class="material-symbols-outlined mr-3">home</span>
          Dashboard
        </a>
        <a class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg"
          href="absensiSISWA.html">
          <span class="material-symbols-outlined mr-3">assignment</span>
          Absensi
        </a>
        <a class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg"
          href="jadwalSISWA.html">
          <span class="material-symbols-outlined mr-3">calendar_month</span>
          Jadwal
        </a>
      </nav>
    </div>

    <!-- Logout di bawah -->
    <div class="p-6">
      <a class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-lg"
        href="login.html">
        <span class="material-symbols-outlined mr-3">logout</span>
        Logout
      </a>
    </div>
  </aside>

  <!-- Overlay (tampil di hp saat sidebar dibuka) -->
  <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-30 md:hidden"></div>

  <!-- Main content -->
  <div class="md:ml-64 transition-all">
    <div class="flex flex-col min-h-screen">
      <!-- Header -->
      <header class="flex justify-between items-center p-4 bg-white border-b">
        <div class="flex items-center">
          <!-- Burger -->
          <button id="burgerBtn" class="mr-4 text-gray-700 md:hidden">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h1 class="text-xl font-semibold">Siswa</h1>
        </div>
        <div class="flex items-center space-x-4">
          <button class="p-2 rounded-full hover:bg-gray-200 transition flex items-center justify-center">
            <span class="material-symbols-outlined text-gray-500">person</span>
          </button>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 p-6">
        <h2 class="text-2xl font-bold mb-6">Profile Saya</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
          <!-- Profile Card -->
          <div class="bg-white shadow-md rounded-lg p-6">
            <div class="flex flex-col items-center">
			  <!-- Wrapper foto + tombol -->
			  <div class="relative">
				<!-- Foto profil -->
				<img id="profileImage" src="assets/rrq.jpg" alt="Profile" 
					 class="w-24 h-24 rounded-full object-cover transition-transform duration-300 ease-in-out hover:scale-110">

				<!-- Tombol icon kamera di pojok kanan bawah foto -->
				<label for="uploadProfile" 
					   class="absolute bottom-0 right-0 bg-gray-700 text-white w-8 h-8 flex items-center justify-center rounded-full cursor-pointer hover:bg-gray-900 shadow-lg">
				  <span class="material-symbols-outlined text-sm">photo_camera</span>
				</label>
			  </div>

			  <!-- Input file disembunyikan -->
			  <input type="file" id="uploadProfile" accept="image/*" class="hidden" />
			  <h3 class="text-lg font-semibold mt-4">rorojoro</h3>
			  <p class="text-gray-500">Siswa</p>
			</div>
          </div>

          <!-- Edit Profile Form -->
		<div class="bg-white shadow-md rounded-lg p-6">
		  <h3 class="text-lg font-semibold mb-4">Edit Profile</h3>
		  <form id="editProfileForm" class="space-y-4">
			<!-- Nip/Nis -->
			<div>
			  <label for="nip_nis" class="block text-sm font-medium">Nip/Nis</label>
			  <input type="text" id="nip_nis" placeholder="Masukkan nip/nis"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				maxlength="20" value="20251004" />

			  <!-- Pesan error -->
			  <small id="nipError" class="text-red-500 text-sm hidden">NIP/NIS wajib angka!</small>
			</div>

			<!-- Nama -->
			<div>
			  <label for="nama" class="block text-sm font-medium">Nama</label>
			  <input type="text" id="nama" placeholder="Masukkan nama Anda"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				value="Calvin Widodo" />

			  <!-- Pesan error -->
			  <small id="namaError" class="text-red-500 text-sm hidden">Nama hanya boleh huruf!</small>
			</div>

			<!-- Role -->
			<div>
			  <label class="block text-sm font-medium mb-1">Role</label>
			  <select class="w-full border rounded-md p-2">
				<option>Super User</option>
				<option selected>User</option>
			  </select>
			</div>

			<!-- Jabatan -->
			<div>
			  <label class="block text-sm font-medium mb-1">Jabatan</label>
			  <select class="w-full border rounded-md p-2">
				<option>Administrator</option>
				<option>Guru BK</option>
				<option>Guru Mapel</option>
				<option selected>Siswa</option>
			  </select>
			</div>

			<!-- No. Tlp -->
			<div>
			  <label for="no_tlp" class="block text-sm font-medium">No. Tlp</label>
			  <input type="text" id="no_tlp" placeholder="Masukkan no.tlp Anda"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				maxlength="12" value="081234567890" />

			  <!-- Pesan error -->
			  <small id="tlpError" class="text-red-500 text-sm hidden">No. Tlp wajib angka dan maksimal 12 digit!</small>
			</div>

			<!-- Email -->
			<div>
			  <label for="email" class="block text-sm font-medium">Email</label>
			  <input type="email" id="email" placeholder="Masukkan email Anda"
				class="mt-1 block w-full px-4 py-3 bg-gray-light dark:bg-gray-dark rounded-md"
				value="calvin_widodo@student.umaha" />
			
			  <!-- Pesan error -->
			  <small id="emailError" class="text-red-500 text-sm hidden">Email Tidak Sesuai!</small>
			</div>

			<!-- Alamat -->
			<div>
			  <label class="block text-sm font-medium mb-1">Alamat</label>
			  <textarea rows="3" placeholder="Masukkan alamat lengkap Anda"
				class="w-full border rounded-md p-2 resize-none">Jl. Melati No. 05, Balongbendo</textarea>
			</div>

			<!-- Jenis Kelamin -->
			<div>
			  <label class="block text-sm font-medium mb-1">Jenis Kelamin</label>
			  <select class="w-full border rounded-md p-2">
				<option value="">Pilih jenis kelamin</option>
				<option value="Laki-laki" selected>Laki-laki</option>
				<option value="Perempuan">Perempuan</option>
			  </select>
			</div>

			<!-- Tombol -->
			<button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">
			  Simpan
			</button>
		  </form>
		 </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="p-4 bg-white text-center border-t">
        <p class="text-sm text-gray-500">Copyright@SIWARU2025</p>
      </footer>
    </div>
  </div>

<script src="js/profileSiswa.js"></script>
  <div id="react-bridge" hidden></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
