<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buat Password Baru - SIWARU</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="shortcut icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <div class="flex justify-center mb-6"><img src="assets/SIWARU.png" alt="SIWARU" class="w-32 h-auto" /></div>
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Buat Password Baru</h1>
    <p class="text-sm text-center text-gray-500 mb-6">Masukkan password baru untuk akun SIWARU kamu.</p>
    <form id="resetPasswordForm" class="space-y-4">
      <div><label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Password baru</label><input id="newPassword" type="password" autocomplete="new-password" required class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Minimal 8 karakter, huruf dan angka" /></div>
      <div><label for="confirmNewPassword" class="block text-sm font-medium text-gray-700 mb-1">Konfirmasi password baru</label><input id="confirmNewPassword" type="password" autocomplete="new-password" required class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ulangi password baru" /></div>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-md font-semibold hover:bg-blue-700">Simpan Password Baru</button>
    </form>
    <p class="text-sm text-center mt-5"><a href="login.html" class="text-blue-600 hover:underline">Kembali ke Login</a></p>
  </main>
  <div id="react-bridge" hidden></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
